name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent concurrent deployments
concurrency:
  group: github-pages
  url: ${{ steps.deployment.outputs.pages_url }}

# Required permissions for deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Optional: supply Cloudinary credentials so fetch-photos.mjs can refresh
  # src/data/photos.json. If absent, the build keeps the committed manifest.
  VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
  CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
  CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.pages_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Serves the site at the custom domain configured in the repo
          # Settings → Pages (and matching DNS CNAME/ALIAS records).
          cname: tonycardone.com
